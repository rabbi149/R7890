<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"></meta>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
    <title>Aviator Pro BD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background: #111827;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .history-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 8px 5px;
            background: #1f2937;
            border-radius: 8px;
            margin-bottom: 12px;
            white-space: nowrap;
        }
        .history-item {
            font-size: 12px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            background: #374151;
            color: #10b981;
        }
        .history-item.high { color: #f59e0b; }
        .history-item.low { color: #ef4444; }

        .game-screen {
            background: radial-gradient(circle, #1f2937 0%, #0b0f19 100%);
            height: 220px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 1px solid #374151;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .plane-icon {
            font-size: 35px;
            position: absolute;
            top: 30px;
            right: 40px;
            transform: rotate(15deg);
        }
        .multiplier-text {
            font-size: 42px;
            font-weight: bold;
            color: #ffffff;
            z-index: 2;
        }
        .game-status {
            font-size: 14px;
            color: #9ca3af;
            margin-top: 5px;
            z-index: 2;
        }
        .top-info {
            display: flex;
            justify-content: space-between;
            padding: 5px 5px 10px 5px;
            font-size: 15px;
            font-weight: bold;
            color: #10b981;
        }
        .bet-card {
            background: #1f2937;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #374151;
        }
        .bet-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111827;
            border-radius: 8px;
            padding: 6px;
            margin-bottom: 10px;
        }
        .bet-input {
            width: 80px;
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
            outline: none;
        }
        .ctrl-btn {
            background: #374151;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        .quick-amounts {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        .qa-btn {
            flex: 1;
            background: #374151;
            border: none;
            color: white;
            padding: 6px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-bet-green { background-color: #10b981; color: white; }
        .btn-cashout-orange { background-color: #f59e0b; color: #000; }
        .btn-disabled { background-color: #4b5563; color: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="top-info">
            <span>Aviator Pro</span>
            <span>ব্যালেন্স: <span id="userBalance">1000.00</span> BDT</span>
        </div>

        <div class="history-bar" id="historyBar">
            <div class="history-item low">1.12x</div>
            <div class="history-item">2.45x</div>
            <div class="history-item high">15.80x</div>
            <div class="history-item low">1.05x</div>
        </div>

        <div class="game-screen" id="gameScreen">
            <div class="plane-icon" id="planeIcon">&#9992;&#65039;</div>
            <div class="multiplier-text" id="multiplierDisplay">1.00x</div>
            <div class="game-status" id="gameStatus">বেট ধরে স্টার্ট করুন</div>
        </div>

        <div class="bet-card">
            <div class="bet-row">
                <button class="ctrl-btn" onclick="changeBet(-10)">-</button>
                <input type="number" id="betInput1" class="bet-input" value="10.00"></input>
                <button class="ctrl-btn" onclick="changeBet(10)">+</button>
            </div>
            <div class="quick-amounts">
                <button class="qa-btn" onclick="setBet(50)">50</button>
                <button class="qa-btn" onclick="setBet(200)">200</button>
                <button class="qa-btn" onclick="setBet(1000)">1K</button>
                <button class="qa-btn" onclick="setBet(10000)">10K</button>
            </div>
            <button class="action-btn btn-bet-green" id="mainActionBtn" onclick="handleMainAction()">বেট করুন (10.00 BDT)</button>
        </div>
    </div>

    <script>
        //<![CDATA[
        let balance = 1000.00;
        let currentMultiplier = 1.00;
        let gameInterval = null;
        let gameState = 'IDLE'; 
        let crashPoint = 1.00;
        let activeBetAmount = 0;
        let historyList = [1.12, 2.45, 15.80, 1.05, 3.20, 1.02];

        const balanceEl = document.getElementById('userBalance');
        const multiplierEl = document.getElementById('multiplierDisplay');
        const statusEl = document.getElementById('gameStatus');
        const actionBtn = document.getElementById('mainActionBtn');
        const historyBar = document.getElementById('historyBar');

        function setBet(amount) {
            if(gameState !== 'IDLE') return;
            document.getElementById('betInput1').value = amount.toFixed(2);
            actionBtn.innerText = 'বেট করুন (' + amount.toFixed(2) + ' BDT)';
        }

        function changeBet(amt) {
            if(gameState !== 'IDLE') return;
            let input = document.getElementById('betInput1');
            let val = parseFloat(input.value) + amt;
            if(val < 10) val = 10;
            input.value = val.toFixed(2);
            actionBtn.innerText = 'বেট করুন (' + val.toFixed(2) + ' BDT)';
        }

        function updateHistoryUI() {
            historyBar.innerHTML = '';
            historyList.forEach(function(item) {
                let div = document.createElement('div');
                div.className = 'history-item ' + (item > 5 ? 'high' : (item < 1.30 ? 'low' : ''));
                div.innerText = item.toFixed(2) + 'x';
                historyBar.appendChild(div);
            });
        }

        function handleMainAction() {
            if (gameState === 'IDLE') {
                startRound();
            } else if (gameState === 'RUNNING') {
                cashOut();
            }
        }

        function startRound() {
            activeBetAmount = parseFloat(document.getElementById('betInput1').value);
            if(balance < activeBetAmount) {
                alert('পর্যাপ্ত ব্যালেন্স নেই!');
                return;
            }

            balance -= activeBetAmount;
            balanceEl.innerText = balance.toFixed(2);

            gameState = 'RUNNING';
            currentMultiplier = 1.00;
            
            actionBtn.innerText = 'ক্যাশ আউট (Cash Out)';
            actionBtn.className = 'action-btn btn-cashout-orange';
            statusEl.innerText = 'প্লেন উড়ছে...';

            let randomValue = Math.random();
            if (randomValue < 0.65) {
                crashPoint = 1.01 + Math.random() * 0.40;
            } else if (randomValue < 0.90) {
                crashPoint = 1.41 + Math.random() * 3.59;
            } else {
                crashPoint = 5.00 + Math.pow(Math.random(), 3) * 9995.00;
            }

            gameInterval = setInterval(function() {
                let increment = currentMultiplier < 2 ? 0.01 : (currentMultiplier < 10 ? 0.05 : 0.20);
                currentMultiplier += increment;
                multiplierEl.innerText = currentMultiplier.toFixed(2) + 'x';

                if (currentMultiplier >= crashPoint) {
                    crashGame();
                }
            }, 60);
        }

        function cashOut() {
            if (gameState !== 'RUNNING') return;
            clearInterval(gameInterval);

            let winAmount = activeBetAmount * currentMultiplier;
            balance += winAmount;
            balanceEl.innerText = balance.toFixed(2);

            statusEl.innerText = 'সফল ক্যাশআউট! জিতেছেন ' + winAmount.toFixed(2) + ' BDT';
            actionBtn.className = 'action-btn btn-disabled';
            actionBtn.innerText = 'উত্তোলন সফল!';

            historyList.unshift(currentMultiplier);
            if(historyList.length > 10) historyList.pop();
            updateHistoryUI();

            setTimeout(resetToIdle, 3000);
        }

        function crashGame() {
            clearInterval(gameInterval);
            gameState = 'CRASHED';

            multiplierEl.innerText = crashPoint.toFixed(2) + 'x';
            statusEl.innerText = 'ফ্লাইট ক্র্যাশ হয়ে গেছে!';
            actionBtn.className = 'action-btn btn-disabled';
            actionBtn.innerText = 'ক্র্যাশড!';

            historyList.unshift(crashPoint);
            if(historyList.length > 10) historyList.pop();
            updateHistoryUI();

            setTimeout(resetToIdle, 3000);
        }

        function resetToIdle() {
            gameState = 'IDLE';
            statusEl.innerText = 'বেট ধরে স্টার্ট করুন';
            let currentBetVal = document.getElementById('betInput1').value;
            actionBtn.innerText = 'বেট করুন (' + parseFloat(currentBetVal).toFixed(2) + ' BDT)';
            actionBtn.className = 'action-btn btn-bet-green';
            multiplierEl.innerText = '1.00x';
        }

        updateHistoryUI();
        //]]>
    </script>
</body>
</html>
